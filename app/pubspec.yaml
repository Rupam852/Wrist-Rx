name: wrist_rx
description: Wrist Rx — Your personal health companion smartwatch app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.1
  firebase_auth: ^5.5.4
  firebase_storage: ^12.4.6
  google_sign_in: ^6.3.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  http: ^1.3.0
  web_socket_channel: ^3.0.2

  # Bluetooth
  flutter_blue_plus: ^1.35.3

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  hive_flutter: ^1.1.0

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Device
  image_picker: ^1.1.2
  geolocator: ^13.0.3
  permission_handler: ^11.4.0
  pedometer: ^4.0.1

  # Utils
  intl: ^0.19.0
  fl_chart: ^0.70.2
  uuid: ^4.5.1
  flutter_foreground_task: ^10.0.0
  url_launcher: ^6.3.1     # SMS & WhatsApp intent fallback for SOS

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
